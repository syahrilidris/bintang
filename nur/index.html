<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nur is now part of Bintang</title>
<meta name="theme-color" content="#11131B">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #11131B; color: #F4F6FF; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 380px; }
  h1 { font-size: 28px; margin: 16px 0 8px; }
  p { color: #9AA2C0; font-weight: 600; line-height: 1.5; }
  a { display: inline-block; margin-top: 12px; background: #3FD05A; color: #fff; text-decoration: none; font-weight: 800; padding: 14px 22px; border-radius: 16px; box-shadow: 0 5px 0 #24963A; }
</style>
</head>
<body>
<div class="card">
  <div style="font-size:64px">🌙⭐</div>
  <h1>Nur is now part of Bintang!</h1>
  <p>Prayers, Quran reading, surahs and duas now live in Bintang's Ibadah tab, together with chores and learning. Taking you there with your progress…</p>
  <a id="go" href="https://bintangkids.vercel.app/">Open Bintang</a>
</div>
<script>
// Hand this browser's Nur data to Bintang (it lived only on this phone), then go there.
(function () {
  var target = "https://bintangkids.vercel.app";
  var url = target + "/";
  try {
    var raw = localStorage.getItem("nur-v1");
    var s = raw ? JSON.parse(raw) : null;
    if (s && !s.example && s.kids && s.kids.length) {
      var payload = btoa(unescape(encodeURIComponent(JSON.stringify(s))));
      url = target + "/import#nur=" + payload;
    }
  } catch (e) {}
  document.getElementById("go").href = url;
  // Retire the old offline cache so the old app doesn't come back.
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
  try { if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); } catch (e) {}
  setTimeout(function () { location.replace(url); }, 1200);
})();
</script>
</body>
</html>
