<style>
/* Layout: game-lobby UI. Player cards on top, quest list, chunky 3D buttons, bottom dock. Single committed dark game look. */
:root {
  --bg: #11131B; --bg2: #171A25; --panel: #1F2332; --panel2: #282D40; --line: #343A52; --well: #0E1018;
  --ink: #F4F6FF; --muted: #9AA2C0;
  --blue: #2B8CFF; --blue-d: #1A5FC2;
  --green: #3FD05A; --green-d: #24963A;
  --yellow: #FFC933; --yellow-d: #C9900B;
  --red: #FF4D5E; --red-d: #B8293A;
  --purple: #9B6BFF; --purple-d: #6A3FD0;
  --k1: #FF7A3D; --k2: #2B8CFF; --k3: #3FD05A; --k4: #9B6BFF; --k5: #FFC933;
  --display: "Lilita One", "Arial Black", Impact, system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-weight: 500; font-size: 16px; line-height: 1.4; margin: 0;
  background-image: linear-gradient(var(--bg2) 1px, transparent 1px), linear-gradient(90deg, var(--bg2) 1px, transparent 1px);
  background-size: 32px 32px; }
.wrap { max-width: 660px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 116px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.05; letter-spacing: .01em; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.lbl { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.btn { --c: var(--blue); --d: var(--blue-d); border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 800; font-size: .95rem; background: var(--c); color: #fff; box-shadow: 0 4px 0 var(--d); transition: transform .08s, box-shadow .08s; text-shadow: 0 1px 0 rgba(0,0,0,.2); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--d); }
.btn.green { --c: var(--green); --d: var(--green-d); }
.btn.yellow { --c: var(--yellow); --d: var(--yellow-d); color: #2A1C00; text-shadow: none; }
.btn.red { --c: var(--red); --d: var(--red-d); }
.btn.purple { --c: var(--purple); --d: var(--purple-d); }
.btn.gray { --c: var(--panel2); --d: #151824; color: var(--ink); }
.btn.small { padding: 7px 11px; font-size: .82rem; border-radius: 10px; box-shadow: 0 3px 0 var(--d); }
.btn.small:active:not(:disabled) { transform: translateY(3px); }
.btn:disabled { filter: grayscale(.9) brightness(.7); cursor: not-allowed; }
a.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 42px; height: 42px; border-radius: 10px; background: var(--yellow); display: grid; place-items: center; transform: rotate(-8deg); box-shadow: 0 4px 0 var(--yellow-d); flex: none; animation: wiggle 4s ease-in-out infinite; }
@keyframes wiggle { 0%, 86%, 100% { transform: rotate(-8deg); } 90% { transform: rotate(8deg) scale(1.1); } 94% { transform: rotate(-14deg); } }
.brand h1 { font-size: 1.8rem; }
.brand small { display: block; color: var(--muted); font-size: .76rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtns { display: flex; gap: 6px; flex: none; }
.hb { min-width: 40px; height: 40px; padding: 0 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font-size: 1.1rem; font-weight: 800; box-shadow: 0 3px 0 #0A0C12; }
.hb.txt { font-size: .8rem; letter-spacing: .04em; }
.hb.on { border-color: var(--green); }
.hb:active { transform: translateY(3px); box-shadow: none; }

.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.player { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 16px; border: 3px solid var(--line); background: var(--panel); text-align: left; box-shadow: 0 5px 0 #0A0C12; min-width: 0; transition: transform .1s; }
.player[aria-pressed="true"] { border-color: var(--yellow); background: var(--panel2); }
.player:active { transform: translateY(3px); box-shadow: 0 2px 0 #0A0C12; }
.player .head { display: flex; gap: 12px; align-items: center; min-width: 0; }
.tile { position: relative; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-size: 1.75rem; flex: none; }
.tile .hat { position: absolute; top: -14px; right: -10px; font-size: .78em; transform: rotate(14deg); filter: drop-shadow(0 2px 0 rgba(0,0,0,.4)); }
.player .name { font-family: var(--display); font-size: 1.3rem; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.lvl { display: inline-block; margin-top: 4px; background: var(--purple); color: #fff; font-weight: 800; font-size: .68rem; padding: 2px 7px; border-radius: 6px; letter-spacing: .04em; }
.xp { height: 10px; background: var(--well); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.xp i { display: block; height: 100%; background: linear-gradient(180deg, #6FE884, var(--green)); border-radius: 6px; }
.player .foot { display: flex; justify-content: space-between; align-items: center; font-size: .78rem; font-weight: 700; color: var(--muted); }
.coins { display: inline-flex; align-items: center; gap: 4px; color: var(--yellow); font-weight: 800; }
.you { position: absolute; top: -10px; right: 10px; background: var(--yellow); color: #2A1C00; font-size: .65rem; font-weight: 800; padding: 2px 7px; border-radius: 6px; letter-spacing: .06em; }

.banner { background: var(--panel2); border: 3px solid var(--yellow); border-radius: 16px; padding: 14px 16px; box-shadow: 0 5px 0 #0A0C12; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner p { margin: 4px 0 0; color: var(--muted); font-weight: 600; font-size: .9rem; }
.victory { background: linear-gradient(180deg, #FFD95A, var(--yellow)); color: #2A1C00; border-radius: 16px; padding: 14px 16px; box-shadow: 0 5px 0 var(--yellow-d); display: flex; align-items: center; gap: 12px; }
.victory h3 { font-size: 1.4rem; }
.victory p { margin: 0; font-weight: 700; font-size: .9rem; }

.team { background: linear-gradient(135deg, #24305A, #2A2148); border: 3px solid #4A5590; border-radius: 18px; padding: 14px; box-shadow: 0 5px 0 #0A0C12; display: flex; flex-direction: column; gap: 10px; }
.team .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.team h3 { font-size: 1.25rem; overflow-wrap: anywhere; }
.team .faces { display: flex; padding-left: 6px; }
.team .faces .tile { width: 34px; height: 34px; font-size: 1.1rem; border-radius: 9px; margin-left: -6px; border: 2px solid #2A2148; }
.team .faces .tile .hat { display: none; }
.tbar { height: 18px; background: var(--well); border-radius: 10px; overflow: hidden; border: 2px solid #4A5590; position: relative; }
.tbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--blue), var(--purple)); border-radius: 8px; }
.team.won { border-color: var(--yellow); }
.team.won .tbar i { background: linear-gradient(90deg, var(--yellow), #FFD95A); }
.team .meta { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; font-weight: 700; color: #B9C2E8; flex-wrap: wrap; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat strong { font-family: var(--display); font-weight: 400; font-size: 1.6rem; line-height: 1; display: flex; align-items: center; gap: 6px; }
.stat.s1 strong { color: var(--green); } .stat.s2 strong { color: var(--yellow); } .stat.s3 strong { color: #FF9A4D; }

.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.section-head h2 { font-size: 1.6rem; }
.section-head span { color: var(--muted); font-size: .85rem; font-weight: 600; }
.grouplbl { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 1.05rem; color: var(--muted); margin-top: 4px; }
.grouplbl::after { content: ""; flex: 1; height: 2px; background: var(--line); border-radius: 2px; }

.quests { display: flex; flex-direction: column; gap: 10px; }
.quest { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--panel); border: 3px solid var(--line); border-radius: 16px; text-align: left; width: 100%; box-shadow: 0 5px 0 #0A0C12; transition: transform .08s, box-shadow .08s, background .2s; min-width: 0; }
.quest:active { transform: translateY(4px); box-shadow: 0 1px 0 #0A0C12; }
.quest .tile { background: var(--panel2); box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.12); }
.quest .t { font-weight: 700; font-size: 1rem; overflow-wrap: anywhere; }
.quest .rw { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; font-size: .8rem; font-weight: 800; color: var(--yellow); }
.quest .go { min-width: 64px; text-align: center; padding: 8px 10px; border-radius: 10px; font-weight: 800; font-size: .8rem; background: var(--blue); box-shadow: 0 3px 0 var(--blue-d); color: #fff; }
.quest.done { background: #183A26; border-color: var(--green); }
.quest.done .tile { background: var(--green); }
.quest.done .t { color: #BFF5CA; }
.quest.done .go { background: var(--green); box-shadow: 0 3px 0 var(--green-d); }

.biggrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.bigwrap { position: relative; min-width: 0; }
.bigq { width: 100%; aspect-ratio: 1 / 1; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; background: var(--panel); border: 4px solid var(--line); border-radius: 22px; box-shadow: 0 6px 0 #0A0C12; text-align: center; }
.bigq:active { transform: translateY(5px); box-shadow: 0 1px 0 #0A0C12; }
.bigq .e { font-size: 3.4rem; line-height: 1; }
.bigq .t { font-weight: 700; font-size: .9rem; overflow-wrap: anywhere; }
.bigq .s { display: inline-flex; gap: 2px; }
.bigq.done { background: #183A26; border-color: var(--green); }
.bigq.done::after { content: "✓"; position: absolute; top: 8px; left: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; box-shadow: 0 3px 0 var(--green-d); }
.say { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--purple); box-shadow: 0 3px 0 var(--purple-d); font-size: 1.1rem; }
.say:active { transform: translateY(3px); box-shadow: none; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: .68rem; font-weight: 700; color: var(--muted); min-width: 0; }
.day .bar { width: 100%; height: 64px; background: var(--well); border: 2px solid var(--line); border-radius: 10px; position: relative; overflow: hidden; }
.day .bar i { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #FFD95A, var(--yellow)); }
.day.is-today { color: var(--yellow); }
.day b { color: var(--ink); font-weight: 800; font-size: .8rem; }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 10px 6px; border-radius: 14px; background: var(--panel2); border: 2px solid var(--line); min-width: 0; }
.badge .e { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 1.6rem; background: radial-gradient(circle at 50% 35%, #FFE68A, var(--yellow) 60%, var(--yellow-d)); box-shadow: 0 3px 0 #7A5600; }
.badge b { font-size: .76rem; font-weight: 800; line-height: 1.15; }
.badge small { font-size: .66rem; color: var(--muted); line-height: 1.2; }
.badge.off .e { background: var(--well); box-shadow: none; filter: grayscale(1); opacity: .45; }
.badge.off b { color: var(--muted); }

.panel { background: var(--panel); border: 3px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 0 #0A0C12; }
.panel h3 { font-size: 1.3rem; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--well); border-radius: 14px; padding: 5px; border: 2px solid var(--line); }
.seg button { border: 0; border-radius: 10px; padding: 9px 6px; font-weight: 800; background: transparent; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel2); color: var(--ink); box-shadow: 0 3px 0 #0A0C12; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.item { background: var(--panel); border: 3px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 5px 0 #0A0C12; min-width: 0; }
.item .art { height: 76px; border-radius: 12px; display: grid; place-items: center; font-size: 2.4rem; background: radial-gradient(circle at 50% 40%, #3A4262, #232842); }
.item .art .tile { width: 52px; height: 52px; font-size: 1.8rem; }
.item .t { font-weight: 700; overflow-wrap: anywhere; flex: 1; }
.item .price { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; color: var(--yellow); }
.item .left { font-size: .75rem; color: var(--muted); font-weight: 600; }
.item.afford { border-color: var(--yellow); }
.item.own { border-color: var(--green); }
.ask { display: flex; gap: 6px; }
.profile { flex-direction: row; align-items: center; gap: 18px; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 160px; min-width: 0; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
input[type=text], input[type=number], select, textarea { background: var(--well); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; color: var(--ink); font-weight: 600; }
textarea { resize: vertical; min-height: 84px; font-weight: 500; }
/* app feel: no zoom, no text-selection callouts on tap */
html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior-y: none; }
button, nav.dock, .quest, .bigq, .player { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input, select, textarea { font-size: 16px !important; }
input:focus, select:focus, textarea:focus { border-color: var(--blue); outline: none; }
.empty { text-align: center; color: var(--muted); padding: 20px 12px; }
.empty h3 { color: var(--ink); margin-bottom: 6px; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 2px solid var(--panel2); min-width: 0; flex-wrap: wrap; }
.li:first-child { border-top: 0; }
.li .t { flex: 1 1 120px; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.ctrls { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.days7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; }
.days7 button { border: 2px solid var(--line); background: var(--well); color: var(--muted); border-radius: 8px; padding: 6px 0; font-size: .72rem; font-weight: 800; }
.days7 button[aria-pressed="true"] { border-color: var(--blue); background: rgba(43,140,255,.18); color: #CFE4FF; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px dashed var(--blue); color: #8EC2FF; background: rgba(43,140,255,.08); border-radius: 10px; padding: 6px 10px; font-size: .82rem; font-weight: 700; }
.chip:disabled { border: 2px solid var(--line); color: var(--muted); background: transparent; }
.chip[aria-pressed="true"] { border: 2px solid var(--yellow); color: var(--yellow); background: rgba(255,201,51,.1); }
.avatars { display: flex; flex-wrap: wrap; gap: 8px; }
.avatars button { width: 46px; height: 46px; border-radius: 10px; border: 3px solid var(--line); background: var(--panel2); font-size: 1.4rem; }
.avatars button[aria-pressed="true"] { border-color: var(--yellow); background: #3A3420; }
.hint { font-size: .82rem; color: var(--muted); margin: 0; font-weight: 500; }
.confirm { background: rgba(255,77,94,.12); border: 2px solid var(--red); border-radius: 12px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 3px; background: var(--well); border: 2px solid var(--line); border-radius: 8px; padding: 2px 7px; font-weight: 800; color: var(--yellow); font-size: .8rem; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; background: var(--well); border: 2px solid var(--line); border-radius: 12px; text-align: left; width: 100%; }
.switch .knob { width: 46px; height: 26px; border-radius: 14px; background: var(--panel2); position: relative; flex: none; transition: background .2s; }
.switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] .knob { background: var(--green); }
.switch[aria-checked="true"] .knob::after { transform: translateX(20px); background: #fff; }
.switch b { display: block; font-size: .92rem; }
.switch small { color: var(--muted); font-size: .78rem; }
.lockcard { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; background: var(--panel); border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); font-weight: 600; font-size: .9rem; }

.rate { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.rate button { border: 3px solid var(--line); background: var(--panel2); border-radius: 12px; padding: 8px 0; font-size: 1.6rem; box-shadow: 0 4px 0 #0A0C12; }
.rate button[aria-pressed="true"] { border-color: var(--yellow); background: #3A3420; }
.support { background: linear-gradient(135deg, #2A2148, #24305A); border: 3px solid var(--yellow); border-radius: 18px; padding: 16px; box-shadow: 0 5px 0 #0A0C12; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.support h3 { font-size: 1.3rem; }
.support p { margin: 6px 0 0; font-size: .88rem; color: #C9D0EE; font-weight: 500; }
.support .qr { width: 132px; max-width: 100%; background: #fff; border-radius: 12px; padding: 6px; display: block; image-rendering: pixelated; box-shadow: 0 4px 0 #0A0C12; }
.support .tag { display: inline-block; margin-top: 8px; font-size: .72rem; font-weight: 800; letter-spacing: .06em; color: #2A1C00; background: var(--yellow); border-radius: 6px; padding: 2px 8px; }
@media (max-width: 420px) { .support { grid-template-columns: 1fr; justify-items: center; text-align: center; } .support .qr { width: 180px; } }
.wa { --c: #25D366; --d: #128C4A; font-size: 1.05rem; padding: 14px 16px; }
.numrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 700; }
.numrow code { font-family: var(--body); background: var(--well); border: 2px solid var(--line); border-radius: 8px; padding: 4px 8px; user-select: all; }

// ================= parent lock & modals =================
function requireParent(fn) {
  if (canParent()) { fn(); return; }
  ui.modal = { type: "pin", mode: "unlock", entry: "", pending: fn, err: "" }; renderModal();
}
function grownQ() { return { a: 6 + Math.floor(Math.random() * 7), b: 11 + Math.floor(Math.random() * 8) }; }
function renderModal() {
  const el = document.getElementById("modal"), m = ui.modal;
  if (!m) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  const anim = m.shownMode === m.mode ? "" : " anim"; m.shownMode = m.mode;
  if (m.type === "pin") {
    if (m.mode === "forgot") {
      el.innerHTML = `<div class="mcard${anim}" role="dialog" aria-modal="true"><h3>🔑 ${t("forgot")}</h3><p class="hint" style="text-align:center;font-size:.95rem">${esc(t("grownQ", m.q.a, m.q.b))}</p>
        <input type="number" id="grown-ans" inputmode="numeric" aria-label="${t("check")}"><div class="merr">${esc(m.err || "")}</div>

      setTimeout(() => { const i = document.getElementById("grown-ans"); if (i) i.focus(); }, 30);
      return;
    }
    const title = m.mode === "set" ? t("pinNew") : m.mode === "confirm" ? t("pinAgain") : t("pinEnter");
    el.innerHTML = `<div class="mcard${anim}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>🔒 ${esc(title)}</h3>
      <div class="dots ${m.shake ? "shake" : ""}">${[0, 1, 2, 3].map(i => `<i class="${i < m.entry.length ? "on" : ""}"></i>`).join("")}</div>
      <div class="merr">${esc(m.err || "")}</div>
      <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-m="key" data-k="${n}">${n}</button>`).join("")}<button data-m="close" aria-label="${t("cancel")}" style="font-size:1.1rem">✕</button><button data-m="key" data-k="0">0</button><button data-m="back" aria-label="⌫">⌫</button></div>
      ${m.mode === "unlock" ? `<button class="linkish" data-m="forgot">${t("forgot")}</button>` : ""}</div>`;
    m.shake = false;
    return;
  }
  if (m.type === "bonus") {
    const k = kidById(m.kid); if (!k) { ui.modal = null; renderModal(); return; }
    el.innerHTML = `<div class="mcard${anim}" role="dialog" aria-modal="true"><div class="row" style="justify-content:center">${tile(k)}</div><h3>${esc(t("bonusT", k.name))}</h3>
      <span class="lbl">${t("why")}</span>
      <div class="chips">${BONUS.map(([id, ic, en, ms]) => `<button class="chip" data-m="reason" data-v="${id}" aria-pressed="${m.reason === id}">${ic} ${esc(lang === "ms" ? ms : en)}</button>`).join("")}</div>
      <span class="lbl">${t("howMany")}</span>
      <div class="amounts">${[1, 2, 3, 5].map(n => `<button data-m="amt" data-v="${n}" aria-pressed="${m.stars === n}">+${n}</button>`).join("")}</div>
      <div class="row"><button class="btn purple grow" data-m="give">🙌 ${t("give")}</button><button class="btn gray" data-m="close">${t("cancel")}</button></div></div>`;
  }
}
function pinEntered() {
  const m = ui.modal; if (!m) return;
  if (m.mode === "unlock") {
    if (m.entry === state.pin) { ui.unlockUntil = Date.now() + 5 * 60 * 1000; const fn = m.pending; ui.modal = null; sfx.unlock(); toast(t("unlockHint")); render(); if (fn) fn(); }
    else { sfx.error(); m.entry = ""; m.err = t("pinWrong"); m.shake = true; renderModal(); }
  } else if (m.mode === "set") { m.first = m.entry; m.entry = ""; m.mode = "confirm"; m.err = ""; sfx.key(); renderModal(); }
  else if (m.mode === "confirm") {
    if (m.entry === m.first) { state.pin = m.entry; ui.unlockUntil = Date.now() + 5 * 60 * 1000; ui.modal = null; save(); sfx.unlock(); toast(t("pinSet")); render(); }
    else { sfx.error(); m.mode = "set"; m.entry = ""; m.first = ""; m.err = t("pinMismatch"); m.shake = true; renderModal(); }
  }
}
document.getElementById("modal").addEventListener("click", (e) => {
  const m = ui.modal; if (!m) return;
  if (e.target.id === "modal") { ui.modal = null; renderModal(); return; }
  const b = e.target.closest("[data-m]"); if (!b) return;
  const a = b.dataset.m;
  if (a === "close") { sfx.tap(); ui.modal = null; renderModal(); return; }
  if (m.type === "pin") {
    if (a === "key" || a === "back") {
      if (m.busy) return;
      if (a === "key" && m.entry.length < 4) m.entry += b.dataset.k;
      if (a === "back") m.entry = m.entry.slice(0, -1);
      sfx.key(); m.err = "";
      document.querySelectorAll("#modal .dots i").forEach((d, i) => d.classList.toggle("on", i < m.entry.length));
      const er = document.querySelector("#modal .merr"); if (er) er.textContent = "";
      if (m.entry.length === 4) { m.busy = true; setTimeout(() => { m.busy = false; pinEntered(); }, 150); }
      return;
    }
    if (a === "forgot") { sfx.tap(); m.mode = "forgot"; m.q = grownQ(); m.err = ""; }
    if (a === "grown-check") {
      const v = parseInt((document.getElementById("grown-ans") || {}).value, 10);
      if (v === m.q.a * m.q.b) { state.pin = null; save(); ui.modal = null; sfx.unlock(); toast(t("pinRemoved")); const fn = m.pending; render(); if (fn) fn(); return; }
      sfx.error(); m.err = t("wrongAns"); m.q = grownQ();
    }
    renderModal(); return;
  }
  if (m.type === "bonus") {
    if (a === "reason") { sfx.tap(); m.reason = b.dataset.v; }
    if (a === "amt") { sfx.tap(); m.stars = +b.dataset.v; }
    if (a === "give") {
      const k = kidById(m.kid); if (!k) return;
      const before = level(k).lv, today = dkey();
      state.done[k.id] = state.done[k.id] || {}; const map = state.done[k.id][today] = state.done[k.id][today] || {};
      map["b_" + uid()] = m.stars;
      state.bonuses.push({ kid: k.id, reason: m.reason, stars: m.stars, date: today });
      const r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 14); floatText(r.left + r.width / 2, r.top - 10, `+${m.stars}`);
      sfx.buy(); confetti(); toast(t("bonusGiven", m.stars, k.name)); fx.bump = k.id;
      ui.modal = null; afterStarsChange(k, before); save(); render(); return;
    }
    renderModal();
  }
});
document.addEventListener("keydown", (e) => {

function completeQuest(k, c, btn) {

document.getElementById("app").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  const kid = b.dataset.kid ? kidById(b.dataset.kid) : null;
  if (!["toggle", "redeem", "mute", "buy-cos", "equip", "say"].includes(a)) sfx.tap();
  switch (a) {
    case "mute": muted = !muted; try { localStorage.setItem(LS + "-mute", muted ? "1" : "0"); } catch (err) {} if (!muted) sfx.coin(); else { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (err) {} } break;
    case "lang": lang = b.dataset.v === "ms" ? "ms" : "en"; try { localStorage.setItem("bintang-lang", lang); } catch (err) {} break;
    case "sel": sel = id; ui.confirm = null; try { localStorage.setItem(LS + "-sel", id); } catch (err) {} break;
    case "goto": if (b.dataset.tab === "family") { requireParent(() => setTab("family")); return; } setTab(b.dataset.tab); return;
    case "say": { const k = kidById(sel), c = k && k.chores.find(x => x.id === id); if (c) say(choreTitle(c)); return; }
    case "toggle": {
      const k = kidById(sel), c = k && k.chores.find(x => x.id === id); if (!c) return;
      const m = (state.done[k.id] || {})[dkey()] || {};
      if (m[id] != null) { requireParent(() => { delete m[id]; sfx.undo(); save(); render(); }); return; }
      completeQuest(k, c, b); break;
    }
    case "bonus": { const k = kidById(sel); if (!k) return; requireParent(() => { ui.modal = { type: "bonus", kid: k.id, reason: "kind", stars: 2 }; renderModal(); }); return; }
    case "unlock": requireParent(() => render()); return;
    case "lock": ui.unlockUntil = 0; toast(t("lockedT")); if (tab === "family") { setTab("today"); return; } break;
    case "ask": ui.confirm = b.dataset.key; break;
    case "ask-redeem": requireParent(() => { ui.confirm = "redeem:" + id; render(); }); return;
    case "cancel": ui.confirm = null; break;
    case "seg": ui.shopSeg = b.dataset.v; ui.confirm = null; fx.enter = true; break;
    case "redeem": {
      const k = kidById(sel), r = state.rewards.find(x => x.id === id);
      if (k && r && balance(k) >= r.cost) {
        const br = b.getBoundingClientRect(); burst(br.left + br.width / 2, br.top, 14); sfx.buy(); confetti(); fx.bump = k.id;
        state.spent[k.id] = (state.spent[k.id] || 0) + r.cost; state.history.push({ kid: k.id, rid: r.rid || RTITLE2ID[r.title], title: r.title, cost: r.cost, date: dkey() });
        toast(t("unlockedR", k.name, rewardTitle(r))); announceBadges(k, checkBadges(k)); save();
      }
      ui.confirm = null; break;
    }
    case "buy-cos": {
      const k = kidById(sel), c = COS[id];
      if (k && c && balance(k) >= c.cost) {
        state.owned[k.id] = state.owned[k.id] || []; if (!state.owned[k.id].includes(id)) state.owned[k.id].push(id);
        state.cspent[k.id] = (state.cspent[k.id] || 0) + c.cost;
        if (c.slot === "avatar") k.avatar = c.icon; else { state.equip[k.id] = state.equip[k.id] || {}; state.equip[k.id][c.slot] = id; }
        const br = b.getBoundingClientRect(); burst(br.left + br.width / 2, br.top, 12); sfx.buy(); fx.bump = k.id; toast(t("lookGood"));
        announceBadges(k, checkBadges(k)); save();
      }
      ui.confirm = null; break;
    }
    case "equip": { const k = kidById(sel), c = COS[id]; if (!k || !c) return; if (c.slot === "avatar") k.avatar = c.icon; else { state.equip[k.id] = state.equip[k.id] || {}; state.equip[k.id][c.slot] = id; } sfx.equip(); save(); break; }
    case "unequip": { const k = kidById(sel); if (k && state.equip[k.id]) delete state.equip[k.id][b.dataset.slot]; save(); break; }
    case "add-reward": {
      const ti = document.getElementById("rw-title").value.trim(); const c = parseInt(document.getElementById("rw-cost").value, 10);
      if (!ti) { toast(t("typeReward")); return; }
      state.rewards.push({ id: uid(), title: ti, icon: "🎁", cost: c > 0 ? c : 10 }); save(); toast(t("addedShop")); break;
    }
    case "add-reward-idea": state.rewards.push(mkReward(id)); save(); break;
    case "del-reward": state.rewards = state.rewards.filter(r => r.id !== id); ui.confirm = null; save(); break;
    case "edit-kid": ui.editKid = ui.editKid === id ? null : id; ui.confirm = null; break;
    case "pick-av": {
      if (b.dataset.for === "nk") { const f = readKidForm("nk", ui.newKid); ui.newKid.name = f.name; ui.newKid.age = f.age; ui.newKid.avatar = b.dataset.av; }
      else { const k = kidById(ui.editKid); if (k) { const f = readKidForm("ek", k); if (f.name) k.name = f.name; k.age = f.age; k.avatar = b.dataset.av; save(); } }
      break;
    }
    case "save-kid": { const k = kidById(id); const f = readKidForm("ek", k); if (!f.name) { toast(t("nameFirst")); return; } k.name = f.name; k.age = f.age; ui.editKid = null; save(); toast(t("saved")); break; }
    case "del-kid": state.kids = state.kids.filter(k => k.id !== id); ["done", "spent", "cspent", "badges", "owned", "equip"].forEach(f => delete state[f][id]); ui.confirm = null; ui.editKid = null; save(); break;
    case "little": kid.little = !kid.little; save(); break;
    case "when": { const c = kid.chores.find(x => x.id === id); const order = ["morning", "any", "evening"]; c.when = order[(order.indexOf(c.when || "any") + 1) % 3]; save(); break; }
    case "days": ui.editDays = ui.editDays === id ? null : id; break;
    case "day": {
      const c = kid.chores.find(x => x.id === id), d = +b.dataset.d;
      let ds = !c.days || !c.days.length ? [0, 1, 2, 3, 4, 5, 6] : c.days.slice();
      ds = ds.includes(d) ? ds.filter(x => x !== d) : ds.concat(d);
      if (!ds.length) return;
      c.days = ds.length === 7 ? null : ds; save(); break;
    }
    case "open-add": ui.adding = true; break;
    case "cancel-add": ui.adding = false; break;
    case "add-kid": {
      const f = readKidForm("nk", ui.newKid); if (!f.name) { toast(t("nameFirst")); return; }
      const used = state.kids.map(k => k.color); const color = COLORS.find(c => !used.includes(c)) || COLORS[state.kids.length % COLORS.length];
      const src = kidById((document.getElementById("nk-copy") || {}).value || "");
      const k = { id: uid(), name: f.name, age: f.age, avatar: ui.newKid.avatar, color, little: f.age <= 5, chores: src ? src.chores.map(c => ({ ...c, id: uid(), days: c.days ? c.days.slice() : null })) : starterFor(f.age) };
      state.kids.push(k); sel = k.id; ui.adding = false; ui.newKid = { name: "", age: 6, avatar: AVATARS[state.kids.length % AVATARS.length], copyFrom: "" };
      sfx.coin(); save(); toast(t("joined", k.name)); break;
    }
    case "add-chore": { const inp = document.getElementById("nc-" + kid.id); const ti = inp.value.trim(); if (!ti) { toast(t("typeQuest")); return; } kid.chores.push({ id: uid(), title: ti, icon: "⭐", stars: 1, when: "any", days: null }); save(); break; }
    case "add-sugg": kid.chores.push(mkChore(b.dataset.sid)); save(); break;
    case "del-chore": kid.chores = kid.chores.filter(c => c.id !== id); save(); break;
    case "stars": { const c = kid.chores.find(x => x.id === id); c.stars = Math.max(1, Math.min(10, c.stars + (+b.dataset.d))); save(); break; }
    case "set-pin": ui.modal = { type: "pin", mode: "set", entry: "", err: "" }; break;
    case "remove-pin": state.pin = null; save(); toast(t("pinRemoved")); break;
    case "save-goal": {
      const ti = document.getElementById("goal-title").value.trim(); const tg = parseInt(document.getElementById("goal-target").value, 10);
      state.team.title = ti; if (tg >= 5) state.team.target = Math.min(9999, tg);
      if (state.team.won === weekId() && teamStars() < state.team.target) delete state.team.won;
      save(); toast(t("saved")); break;
    }
    case "rate": fb.rating = +b.dataset.r; break;
    case "copy-num": {
      try { navigator.clipboard.writeText("+60162097957").then(() => toast(t("numCopied")), () => toast(t("selectNum"))); } catch (err) { toast(t("selectNum")); }
      return;
    }
    case "start-own": state = baseState(); sel = null; ui.adding = true; ui.unlockUntil = 0; save(); setTab("family"); return;
    case "reset": state = baseState(); sel = null; ui.confirm = null; ui.adding = true; save(); break;
  }
  render();
});

document.getElementById("app").addEventListener("change", (e) => { if (e.target.id === "nk-copy") ui.newKid.copyFrom = e.target.value; });
document.getElementById("app").addEventListener("input", (e) => {
  const map = { "fb-like": "like", "fb-improve": "improve", "fb-ages": "ages" };
  const k = map[e.target.id]; if (!k) return;
  fb[k] = e.target.value;
  const a = document.getElementById("fb-send"); if (a) a.href = waLink();
});
document.getElementById("app").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  const id = e.target.id;
  const btn = id.startsWith("nc-") ? e.target.nextElementSibling : id === "rw-title" ? document.querySelector('[data-act="add-reward"]') : id.startsWith("nk-") ? document.querySelector('[data-act="add-kid"]') : id.startsWith("goal-") ? document.querySelector('[data-act="save-goal"]') : null;
  if (btn) { e.preventDefault(); btn.click(); }
});
try { window.speechSynthesis && window.speechSynthesis.getVoices(); } catch (e) {}
// block pinch / double-tap zoom (iOS ignores user-scalable=no)
["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });

render();
})();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); }); }
</script>
</body>
</html>
